name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Rust unit tests
        run: cargo test --workspace

      - name: Build WASM, native CLI, web, server, and MV3 extension
        run: pnpm build

      - name: Typecheck workspace
        run: pnpm -r typecheck

      - name: Run full workspace test suite
        run: pnpm test

  nsh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nsh
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh
          if [ -x "$HOME/.nsh/bin/nsh" ]; then
            echo "$HOME/.nsh/bin" >> "$GITHUB_PATH"
          elif [ -x "$HOME/.local/bin/nsh" ]; then
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          elif [ -x "$HOME/.cargo/bin/nsh" ]; then
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          elif ! command -v nsh >/dev/null 2>&1; then
            echo "ERROR: nsh binary not found after install.sh" >&2
            exit 1
          fi

      - name: Check and test NSH app
        working-directory: apps/nsh
        run: |
          nsh check
          nsh test
