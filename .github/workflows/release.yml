name: Release

on:
  # push:
  #   tags:
  #     - 'v*'  # Re-enable when Actions quota resets or repo is public
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.0-rc.1 or v0.2.0)'
        required: true
        default: 'v0.2.0-rc.1'
        type: string
      prerelease:
        description: 'Mark GitHub Release as pre-release'
        required: true
        default: true
        type: boolean
      include_windows:
        description: 'Also build Windows NSH installer'
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: write
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Resolve release metadata
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            PRERELEASE="${{ inputs.prerelease }}"
          else
            TAG="${GITHUB_REF_NAME}"
            if [[ "$TAG" == *-* ]]; then
              PRERELEASE="true"
            else
              PRERELEASE="false"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag=$TAG prerelease=$PRERELEASE"

  build-macos:
    needs: [prepare]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin,wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-macos-universal
          cache-on-failure: true

      - name: Configure Swift module cache path
        run: |
          mkdir -p "$HOME/.cache/nonepwd-swift-mc"
          echo "SWIFT_MODULE_CACHE_DIR=$HOME/.cache/nonepwd-swift-mc" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/nonepwd-swift-mc
          key: macos-swift-mc-v1-${{ hashFiles('apps/desktop/Sources/**') }}
          restore-keys: |
            macos-swift-mc-v1-

      - uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Resolve pnpm store path
        id: pnpm-cache
        run: echo "store_path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store_path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Rust WASM, native dylib, core, and MV3 extension
        run: |
          pnpm build:rust
          pnpm --filter @nonepwd/core build
          pnpm --filter @nonepwd/extension build

      - name: Build macOS universal CLI binaries
        run: |
          mkdir -p release-assets
          if [ -f dist/bin/np-darwin-arm64 ]; then
            cp dist/bin/np-darwin-arm64 release-assets/np-darwin-arm64
          else
            cargo build -p nonepwd-cli --target aarch64-apple-darwin --release
            cp target/aarch64-apple-darwin/release/np release-assets/np-darwin-arm64
          fi
          cargo build -p nonepwd-cli --target x86_64-apple-darwin --release
          cp target/x86_64-apple-darwin/release/np release-assets/np-darwin-x86_64
          chmod 755 release-assets/np-darwin-*

      - name: Test and package macOS NonePwd.app
        run: |
          ./apps/desktop/scripts/test.sh
          ./apps/desktop/scripts/build-app.sh
          ditto -c -k --sequesterRsrc --keepParent apps/desktop/dist/NonePwd.app release-assets/NonePwd-macos-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos-assets
          path: release-assets/*

  build-ios:
    needs: [prepare]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure NSH cache env
        run: |
          mkdir -p "$HOME/.cache/nsh"
          echo "NSH_CACHE=$HOME/.cache/nsh" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: |
            /opt/homebrew/Cellar/nsh
            ~/.nsh
            ~/.cache/nsh
          key: macos-nsh-ios-v1

      - name: Install nsh and iOS component
        run: |
          NSH_BIN="$(command -v nsh || true)"
          if [ -z "$NSH_BIN" ]; then
            NSH_CELLAR_BIN="$(find /opt/homebrew/Cellar/nsh -maxdepth 2 -type d -name bin 2>/dev/null | sort -V | tail -n 1 || true)"
            if [ -n "$NSH_CELLAR_BIN" ] && [ -x "$NSH_CELLAR_BIN/nsh" ]; then
              brew link --overwrite nsh >/dev/null 2>&1 || echo "$NSH_CELLAR_BIN" >> "$GITHUB_PATH"
              NSH_BIN="$NSH_CELLAR_BIN/nsh"
            fi
          fi
          if [ -z "$NSH_BIN" ]; then
            brew install longbridge/tap/nsh
            NSH_BIN="$(command -v nsh)"
          fi
          if ! "$NSH_BIN" component list 2>/dev/null | grep -qE '^[[:space:]]*ios[[:space:]]+installed'; then
            "$NSH_BIN" component add ios
          fi
          "$NSH_BIN" --version

      - name: Check, test, and package iOS artifacts
        run: |
          (cd apps/nsh && nsh check && nsh test)
          WORK_DIR="$PWD"
          mkdir -p "$WORK_DIR/dist-ios-sim" "$WORK_DIR/release-assets"
          bash apps/nsh/scripts/package-ios.sh "$WORK_DIR/release-assets/NonePwd-ios-unsigned.ipa"
          nsh package --target ios-simulator -o "$WORK_DIR/dist-ios-sim" apps/nsh
          ditto -c -k --sequesterRsrc --keepParent "$WORK_DIR/dist-ios-sim/NonePwd.app" "$WORK_DIR/release-assets/NonePwd-ios-sim-arm64.app.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-assets
          path: release-assets/*

  build-android:
    needs: [prepare]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK and NSH cache env
        run: |
          ANDROID_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "$HOME/.cache/nsh"
          echo "ANDROID_HOME=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "NSH_CACHE=$HOME/.cache/nsh" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/platforms/android-35
            /usr/local/lib/android/sdk/build-tools/35.0.0
          key: linux-android-sdk-35-v1

      - name: Ensure Android SDK 35
        run: |
          if [ -f "$ANDROID_HOME/platforms/android-35/android.jar" ] && [ -x "$ANDROID_HOME/build-tools/35.0.0/aapt2" ]; then
            echo "Android SDK 35 (platform + build-tools 35.0.0) already available."
            exit 0
          fi
          SDKMANAGER=""
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort -V | tail -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found under $ANDROID_HOME/cmdline-tools" >&2
            exit 1
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.nsh
            ~/.local/bin/nsh
            ~/.local/components
            ~/.local/runtime
            ~/.local/share/nsh
            ~/.cache/nsh
          key: linux-nsh-android-v1

      - name: Install nsh and Android component
        run: |
          find_nsh() {
            if [ -x "$HOME/.nsh/bin/nsh" ]; then
              echo "$HOME/.nsh/bin/nsh"
            elif [ -x "$HOME/.local/bin/nsh" ]; then
              echo "$HOME/.local/bin/nsh"
            elif [ -x "$HOME/.cargo/bin/nsh" ]; then
              echo "$HOME/.cargo/bin/nsh"
            elif command -v nsh >/dev/null 2>&1; then
              command -v nsh
            fi
          }
          NSH_BIN="$(find_nsh || true)"
          if [ -z "$NSH_BIN" ]; then
            curl -fsSL https://nsh.dev/install.sh | sh
            NSH_BIN="$(find_nsh || true)"
          fi
          if [ -z "$NSH_BIN" ] || [ ! -x "$NSH_BIN" ]; then
            echo "ERROR: nsh binary not found after install." >&2
            exit 1
          fi
          echo "$(dirname "$NSH_BIN")" >> "$GITHUB_PATH"
          if ! "$NSH_BIN" component list 2>/dev/null | grep -qE '^[[:space:]]*android[[:space:]]+installed'; then
            "$NSH_BIN" component add android
          fi
          "$NSH_BIN" --version

      - name: Check, test, and package Android APK
        run: |
          (cd apps/nsh && nsh check && nsh test)
          mkdir -p release-assets
          if ! command -v convert >/dev/null 2>&1 && ! command -v magick >/dev/null 2>&1 && ! python3 -c "import PIL" >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-pil
          fi
          ./apps/nsh/scripts/package-android.sh "$PWD/release-assets/NonePwd-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-assets
          path: release-assets/NonePwd-android.apk

  build-windows:
    needs: [prepare]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.include_windows == true }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-client
          cache-on-failure: true

      - name: Configure Windows NSH cache env
        shell: pwsh
        run: |
          $cacheDir = Join-Path $env:USERPROFILE '.nsh-cache'
          New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null
          "NSH_CACHE=$cacheDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/cache@v4
        with:
          path: |
            ~/.nsh-cache
            ${{ runner.temp }}/nsh-bin
          key: windows-nsh-v1

      - name: Build Windows CLI binary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          cargo build -p nonepwd-cli --release
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed with exit code $LASTEXITCODE" }
          Copy-Item target\release\np.exe -Destination release-assets\np-windows-x64.exe -Force

      - name: Download or restore nsh for Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $extractDir = Join-Path $env:RUNNER_TEMP 'nsh-bin'
          $nshExe = $null
          if (Test-Path $extractDir) {
            $nshExe = Get-ChildItem -Path $extractDir -Filter 'nsh.exe' -Recurse -File | Select-Object -First 1
          }

          if (-not $nshExe) {
            $headers = @{
              'User-Agent' = 'nonepwd-ci'
              'Accept'     = 'application/vnd.github+json'
            }
            $release = $null
            try {
              $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/longbridge/nsh/releases/latest' -Headers $headers
            } catch {
              Write-Warning "GitHub API lookup for longbridge/nsh failed ($($_.Exception.Message)); falling back to latest release URL."
            }

            if ($release) {
              $asset = $release.assets | Where-Object {
                ($_.name -like '*x86_64-pc-windows*.zip' -or $_.name -like '*windows*x86_64*.zip' -or $_.name -like '*x86_64*windows*.zip') -and
                $_.name -notlike '*.sha256*'
              } | Select-Object -First 1
              if (-not $asset) {
                $asset = $release.assets | Where-Object {
                  $_.name -like '*windows*.zip' -and
                  $_.name -notmatch 'arm64|aarch64' -and
                  $_.name -notlike '*.sha256*'
                } | Select-Object -First 1
              }
              if (-not $asset) {
                $available = ($release.assets | ForEach-Object { $_.name }) -join ', '
                throw "No Windows x86_64 zip asset found in longbridge/nsh $($release.tag_name). Available assets: $available"
              }
              $downloadUrl = $asset.browser_download_url
            } else {
              $downloadUrl = 'https://github.com/longbridge/nsh/releases/latest/download/nsh-windows-x86_64.zip'
            }

            $zipPath = Join-Path $env:RUNNER_TEMP 'nsh-windows.zip'
            New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
            try {
              Invoke-WebRequest -Uri $downloadUrl -Headers @{ 'User-Agent' = 'nonepwd-ci' } -OutFile $zipPath
            } catch {
              throw "Failed to download nsh Windows binary from ${downloadUrl}: $($_.Exception.Message)"
            }

            Expand-Archive -Path $zipPath -DestinationPath $extractDir -Force
            $nshExe = Get-ChildItem -Path $extractDir -Filter 'nsh.exe' -Recurse -File | Select-Object -First 1
            if (-not $nshExe) {
              throw "nsh.exe not found in extracted archive from $downloadUrl"
            }
          }

          $nshExe.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $nshExe.FullName --version
          if ($LASTEXITCODE -ne 0) { throw "nsh --version failed" }
          $componentList = (& $nshExe.FullName component list 2>&1) -join "`n"
          Write-Host $componentList
          if ($componentList -match '(?m)^\s*windows\b') {
            & $nshExe.FullName component add windows
            if ($LASTEXITCODE -ne 0) { throw "nsh component add windows failed" }
          }

      - name: Check, test, and package Windows NSH app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location apps\nsh
          try {
            nsh check
            if ($LASTEXITCODE -ne 0) { throw "nsh check failed with exit code $LASTEXITCODE" }
            nsh test
            if ($LASTEXITCODE -ne 0) { throw "nsh test failed with exit code $LASTEXITCODE" }
          } finally {
            Pop-Location
          }

          $outDir = Join-Path (Get-Location) 'dist-win'
          if (Test-Path $outDir) { Remove-Item $outDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $outDir, 'release-assets' | Out-Null

          nsh package --target windows -o $outDir apps\nsh
          if ($LASTEXITCODE -ne 0) { throw "nsh package --target windows failed with exit code $LASTEXITCODE" }

          $existingZip = Get-ChildItem -Path $outDir -Filter '*.zip' -File | Select-Object -First 1
          if ($existingZip) {
            Copy-Item $existingZip.FullName -Destination 'release-assets\NonePwd-windows-x64.zip' -Force
          } else {
            Compress-Archive -Path "$outDir\*" -DestinationPath 'release-assets\NonePwd-windows-x64.zip' -Force
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: release-assets/*

  build-linux-and-extension:
    needs: [prepare]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
          components: llvm-tools-preview

      - name: Configure rust-lld on PATH
        run: |
          SYSROOT="$(rustc --print sysroot)"
          HOST="$(rustc -vV | awk '/^host:/ {print $2}')"
          LLD_BIN_DIR="$SYSROOT/lib/rustlib/$HOST/bin"
          echo "$LLD_BIN_DIR" >> "$GITHUB_PATH"
          if [ ! -x "$LLD_BIN_DIR/rust-lld" ] && command -v ld.lld >/dev/null 2>&1; then
            mkdir -p "$HOME/.local/bin"
            ln -sf "$(command -v ld.lld)" "$HOME/.local/bin/rust-lld"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-musl-wasm
          cache-on-failure: true

      - uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Resolve pnpm store path
        id: pnpm-cache
        run: echo "store_path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store_path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build full workspace and Linux binaries
        run: pnpm build

      - name: Run full test suite
        run: pnpm test

      - name: Stage Linux binaries, extension archive, and CLI installer
        run: |
          mkdir -p release-assets
          cp dist/bin/np-linux-x86_64 release-assets/
          cp dist/bin/np-linux-arm64 release-assets/
          cp dist/bin/nonepwd-extension.zip release-assets/
          cp scripts/install-cli.sh release-assets/
          chmod 755 release-assets/np-linux-* release-assets/install-cli.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-and-extension
          path: release-assets/*

  docker-ghcr:
    needs: [prepare]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase GHCR image tags
        run: |
          IMAGE_REPO=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          TAGS="${IMAGE_REPO}:${{ needs.prepare.outputs.tag }}"
          if [ "${{ needs.prepare.outputs.prerelease }}" != "true" ]; then
            TAGS="${TAGS},${IMAGE_REPO}:latest"
          fi
          echo "IMAGE_REPO=$IMAGE_REPO" >> "$GITHUB_ENV"
          echo "IMAGE_TAGS=$TAGS" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-npm:
    needs: [prepare, build-linux-and-extension]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && needs.prepare.outputs.prerelease != 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-linux-wasm
          cache-on-failure: true

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Resolve pnpm store path
        id: pnpm-cache
        run: echo "store_path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store_path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install workspace dependencies and build packages
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Publish @nonepwd packages idempotently
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN secret is not configured; skipping npm publish."
            exit 0
          fi
          for PKG in @nonepwd/core @nonepwd/cf-email-worker @nonepwd/cli @nonepwd/server; do
            VER=$(node -p "const fs=require('fs');const dirs={'@nonepwd/core':'core','@nonepwd/cf-email-worker':'cf-email-worker','@nonepwd/cli':'cli','@nonepwd/server':'server'};JSON.parse(fs.readFileSync('packages/'+dirs[process.argv[1]]+'/package.json','utf8')).version" "$PKG")
            if npm view "$PKG@$VER" version >/dev/null 2>&1; then
              echo "$PKG@$VER already published on npm; skipping."
            else
              pnpm --filter "$PKG" publish --access public --no-git-checks
            fi
          done

  publish-release:
    needs: [prepare, build-macos, build-ios, build-android, build-windows, build-linux-and-extension, docker-ghcr]
    if: |
      always() &&
      needs.prepare.result == 'success' &&
      needs.build-macos.result == 'success' &&
      needs.build-ios.result == 'success' &&
      needs.build-android.result == 'success' &&
      (needs.build-windows.result == 'success' || needs.build-windows.result == 'skipped') &&
      needs.build-linux-and-extension.result == 'success' &&
      needs.docker-ghcr.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download workflow artifacts via gh CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts-raw artifacts
          for attempt in 1 2 3 4; do
            rm -rf artifacts-raw/*
            if gh run download "${{ github.run_id }}" -R "${{ github.repository }}" --dir artifacts-raw; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "ERROR: gh run download failed after 4 attempts" >&2
              exit 1
            fi
            sleep 5
          done
          find artifacts-raw -type f -exec cp -f {} artifacts/ \;
          ls -la artifacts

      - name: Verify required client assets and generate SHA-256 checksums
        run: |
          cd artifacts
          for req in NonePwd-macos-arm64.zip NonePwd-ios-unsigned.ipa NonePwd-ios-sim-arm64.app.zip NonePwd-android.apk nonepwd-extension.zip np-darwin-arm64 np-darwin-x86_64 np-linux-x86_64 np-linux-arm64 install-cli.sh; do
            if [ ! -f "$req" ]; then
              echo "ERROR: Missing required release asset: $req" >&2
              exit 1
            fi
          done
          rm -f SHA256SUMS.txt
          sha256sum -- * > /tmp/SHA256SUMS.txt
          mv /tmp/SHA256SUMS.txt SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          files: artifacts/*
          generate_release_notes: true
