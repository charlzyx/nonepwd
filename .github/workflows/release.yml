name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build macOS universal target binaries
        run: |
          mkdir -p release-assets
          cargo build -p nonepwd-cli --target aarch64-apple-darwin --release
          cp target/aarch64-apple-darwin/release/np release-assets/np-darwin-arm64
          cargo build -p nonepwd-cli --target x86_64-apple-darwin --release
          cp target/x86_64-apple-darwin/release/np release-assets/np-darwin-x86_64
          chmod 755 release-assets/np-darwin-*

      - uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: release-assets/*

  build-linux-and-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,x86_64-unknown-linux-musl,aarch64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build full workspace and Linux binaries
        run: pnpm build

      - name: Run full test suite
        run: pnpm test

      - name: Stage Linux binaries and extension archive
        run: |
          mkdir -p release-assets
          cp dist/bin/np-linux-x86_64 release-assets/
          cp dist/bin/np-linux-arm64 release-assets/
          cp dist/bin/nonepwd-extension.zip release-assets/
          chmod 755 release-assets/np-linux-*

      - uses: actions/upload-artifact@v4
        with:
          name: linux-and-extension
          path: release-assets/*

  docker-ghcr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase GHCR image repository
        run: |
          IMAGE_REPO=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_REPO=$IMAGE_REPO" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_REPO }}:${{ github.ref_name }}
            ${{ env.IMAGE_REPO }}:latest

  publish-release:
    needs: [build-macos, build-linux-and-extension, docker-ghcr]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: |
          cd artifacts
          sha256sum np-* nonepwd-extension.zip > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
