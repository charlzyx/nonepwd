<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nonepwd — 私有化零知识密码库与实时验证码引擎</title>
    <meta
      name="description"
      content="nonepwd v0.2.0：基于纯 Rust 核心的自建零知识密码管理器与实时验证码引擎，涵盖双密钥 E2EE、通用多账号 IMAP & Cloudflare Email Routing、macOS / Android AutofillService / iOS / Chrome MV3 扩展与 op 兼容 np CLI。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="nonepwd — 私有化零知识密码库与实时验证码引擎" />
    <meta
      property="og:description"
      content="一个私有实例，接管你的全部密码、2FA 与实时邮箱验证码。覆盖 macOS SwiftUI、Android 系统级自动填充、iOS、Chrome MV3 框选扫码扩展与纯 Rust np CLI。"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233555f5'/%3E%3Ccircle cx='16' cy='12.5' r='4.2' fill='none' stroke='%23ffffff' stroke-width='2.6'/%3E%3Cpath d='M16 16.7v7.3M16 20.5h3.5' fill='none' stroke='%23ffffff' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <script>
      try {
        var saved = localStorage.getItem('nonepwd.theme');
        var isDark = saved === 'dark';
        document.documentElement.classList.toggle('dark', isDark);
        document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';

        var params = new URLSearchParams(window.location.search);
        var qLang = (params.get('lang') || '').toLowerCase();
        var sLang = (localStorage.getItem('nonepwd.locale') || '').toLowerCase();
        var bLang = ((navigator.languages && navigator.languages[0]) || navigator.language || '').toLowerCase();
        var pick = qLang || sLang || bLang;
        var isZh = pick.indexOf('zh') === 0;
        document.documentElement.lang = isZh ? 'zh-CN' : 'en';
        document.title = isZh
          ? 'nonepwd — 私有化零知识密码库与实时验证码引擎'
          : 'nonepwd — Self-Hosted Zero-Knowledge Vault & Live OTP Engine';
      } catch (e) {}
    </script>
  </head>
  <body class="bg-background text-foreground antialiased selection:bg-foreground/15 selection:text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
