<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nonepwd — Zero-Knowledge Self-Hosted Vault &amp; OTP Engine</title>
    <script>
      try {
        var saved = localStorage.getItem('nonepwd.theme');
        var m = matchMedia('(prefers-color-scheme: dark)');
        var apply = function () {
          var isDark = saved ? saved === 'dark' : m.matches;
          document.documentElement.classList.toggle('dark', isDark);
        };
        apply();
        m.addEventListener('change', function () {
          if (!localStorage.getItem('nonepwd.theme')) apply();
        });
      } catch (e) {}
    </script>
  </head>
  <body class="bg-background text-foreground antialiased selection:bg-foreground/15 selection:text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
