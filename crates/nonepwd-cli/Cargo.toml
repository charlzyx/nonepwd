[package]
name = "nonepwd-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "np"
path = "src/main.rs"

[features]
default = ["agent"]
agent = ["dep:nonepwd-agent", "dep:tokio"]

[dependencies]
nonepwd-agent = { path = "../nonepwd-agent", optional = true }
nonepwd-core = { path = "../nonepwd-core" }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-rustcrypto = "0.0.2-alpha"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", optional = true, features = ["rt-multi-thread"] }
tungstenite = { version = "0.26", default-features = false, features = ["handshake", "url"] }
url = "2"
webpki-roots = "0.26"

[target.'cfg(not(target_env = "musl"))'.dependencies]
nonepwd-server = { path = "../nonepwd-server" }
