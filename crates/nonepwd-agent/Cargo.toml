[package]
name = "nonepwd-agent"
version = "0.1.0"
edition = "2021"
description = "nonepwd Agent Access (protocol v0) user and remote clients. Uses ap-client without its native-tls WebSocket backend."

[dependencies]
ap-client = { git = "https://github.com/bitwarden/agent-access", rev = "512756278c41d19314b462ca978c40d29c51bd36", default-features = false }
ap-relay-client = { git = "https://github.com/bitwarden/agent-access", rev = "512756278c41d19314b462ca978c40d29c51bd36", default-features = false }
ap-relay-protocol = { git = "https://github.com/bitwarden/agent-access", rev = "512756278c41d19314b462ca978c40d29c51bd36", default-features = false }
async-trait = "0.1"
futures-util = "0.3"
nonepwd-core = { path = "../nonepwd-core" }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-rustcrypto = "0.0.2-alpha"
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake"] }
url = "2"
webpki-roots = "0.26"
zeroize = "1"

[dev-dependencies]
nonepwd-server = { path = "../nonepwd-server" }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
